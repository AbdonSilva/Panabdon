name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema para Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3 python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            openjdk-17-jdk unzip zip autoconf libtool pkg-config \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Crear parche anti-error para Clang
        run: |
          mkdir -p /tmp/clang-wrapper
          cat << 'EOF' > /tmp/clang-wrapper/clang
          #!/bin/bash
          for arg in "$@"; do
            if [ "$arg" = "-print-multi-os-directory" ]; then
              echo ""
              exit 0
            fi
          done
          REAL_CLANG=$(find /home/runner/.buildozer -name "clang" -type f -executable ! -path "*/clang-wrapper/*" 2>/dev/null | head -n 1)
          if [ -z "$REAL_CLANG" ]; then
            REAL_CLANG="/usr/bin/clang"
          fi
          exec "$REAL_CLANG" "$@"
          EOF
          chmod +x /tmp/clang-wrapper/clang
          cp /tmp/clang-wrapper/clang /tmp/clang-wrapper/clang++
          echo "/tmp/clang-wrapper" >> $GITHUB_PATH

      - - name: Construir la APK (Debug)
        run: |
          export P4A_LOCAL_RECIPES_DIR="$(pwd)/p4a-recipes"
          yes | buildozer -v android debug
        env:
          CC: gcc
          CXX: g++
          LD: gcc
          HOSTCC: gcc
          CFLAGS: "-fPIC"
          LDFLAGS: "-fPIC"
      - name: Subir la APK generada como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-debug-apk
          path: bin/*.apk